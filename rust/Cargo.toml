[package]
name = "rust_lib_debugvideoagent"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
walkdir = "2.3"
zip = "0.6"
flutter_rust_bridge = "=2.12.0"
ureq = { version = "2.9", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
urlencoding = "2.1"
rayon = "1.8"
lazy_static = "1.4.0"
lz4 = "1"
tar = "0.4"
chrono = "0.4"
memmap2 = "0.9"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
